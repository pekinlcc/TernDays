<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1F6289; } a:hover { color: #2E7FA8; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 28px 20px 20px 20px; background: #F4F6F8; color: #1F2B38; overflow: hidden;">

  <div style="display: flex; align-items: center;">
    <div style="width: 34px; height: 34px; border-radius: 11px; background: #FFFFFF; color: #40515F; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </div>
    <div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 700;">导出数据</div>
    <div style="width: 34px; height: 34px;"></div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #6B7A89; padding: 4px 2px 0 2px;">导出范围</div>
  <div style="display: flex; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 12px; background: #EAF3F8; border: 1.5px solid #2E7FA8; color: #1F6289; font-size: 14px; font-weight: 600; box-sizing: border-box;">
      2026 年<span style="font-size: 11px; font-weight: 400; color: #5E85A0;">1月1日 – 8月31日</span>
    </div>
    <div style="display: flex; align-items: center; padding: 10px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E9EE; color: #6B7A89; font-size: 14px; box-sizing: border-box;">2025 年</div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #6B7A89; padding: 6px 2px 0 2px;">文件格式</div>
  <div style="display: flex; gap: 10px;">
    <div style="flex-grow: 1; flex-basis: 0; position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: #EAF3F8; border: 1.5px solid #2E7FA8; box-sizing: border-box;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6289" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="m9.5 12 5 5"/><path d="m14.5 12-5 5"/></svg>
      <div style="font-size: 15px; font-weight: 700; color: #1F6289;">Excel</div>
      <div style="font-size: 11px; color: #5E85A0;">.xlsx · 分表：汇总 + 明细</div>
      <div style="position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 50%; background: #2E7FA8; display: flex; align-items: center; justify-content: center;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      </div>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E9EE; box-sizing: border-box;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7A89" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
      <div style="font-size: 15px; font-weight: 700;">CSV</div>
      <div style="font-size: 11px; color: #9AA7B4;">.csv · 通用纯文本格式</div>
    </div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #6B7A89; padding: 6px 2px 0 2px;">导出内容</div>
  <div style="background: #FFFFFF; border-radius: 14px; padding: 2px 16px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #EEF2F5;">
      <div style="width: 20px; height: 20px; border-radius: 6px; background: #2E7FA8; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 600;">城市汇总</div>
        <div style="font-size: 12px; color: #6B7A89;">每个城市的累计天数</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0;">
      <div style="width: 20px; height: 20px; border-radius: 6px; background: #2E7FA8; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 600;">每日明细</div>
        <div style="font-size: 12px; color: #6B7A89;">每天早 / 晚打卡的时间、城市与计天结果</div>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 12px; color: #9AA7B4;">预览 · 每日明细</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11px;">
      <div style="color: #9AA7B4;">日期</div><div style="color: #9AA7B4;">早7点</div><div style="color: #9AA7B4;">晚5点</div><div style="color: #9AA7B4;">计入</div>
      <div>08-24</div><div>上海</div><div>上海</div><div>上海 +1</div>
      <div>08-25</div><div>上海</div><div>深圳</div><div>各 +0.5</div>
      <div>08-26</div><div>深圳</div><div>深圳</div><div>深圳 +1</div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 52px; border-radius: 14px; background: #2E7FA8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4"/><path d="m8.5 7.5 3.5-3.5 3.5 3.5"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      生成文件并分享
    </div>
    <div style="text-align: center; font-size: 11px; color: #9AA7B4; line-height: 1.6;">通过系统分享面板保存到手机或发送给其他 App<br>文件在本机生成，不经过网络</div>
  </div>
</div>
</x-dc>
</body>
</html>
