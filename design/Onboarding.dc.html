  <div style="text-align: center; font-size: 14px; color: #6B7A89; line-height: 1.7; margin-top: 12px; padding: 0 8px;">每天早上 7:00 和下午 5:00，TernDays 在后台各记录一次 GPS 定位，只保留“城市”级别的结果，用来统计你一年里在每座城市待了多少天。</div>

    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0;">

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 600;">几乎不耗电</div>
        <div style="font-size: 12px; color: #6B7A89;">每天仅定位两次，没有后台常驻服务</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
    <div style="height: 52px; border-radius: 14px; background: #2E7FA8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">允许定位，开始统计</div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #6B7A89;">稍后再说</div>
    <div style="text-align: center; font-size: 11px; color: #9AA7B4; line-height: 1.6;">后台任务由手机系统调度，实际记录时间可能<br>在 07:00 / 17:00 附近略有浮动</div>
  </div>
