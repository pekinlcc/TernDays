name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "发布版本号（如 v0.1）。填写后会在当前提交上创建该 tag 并发布 Release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        working-directory: android
        run: ./gradlew --no-daemon :core:test

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Resolve version
        id: ver
        run: |
          # 发布判定优先级：手动输入 > v* tag 推送 > RELEASE_VERSION 文件里还没打过 tag 的版本
          RELEASE="${{ github.event.inputs.release_version }}"
          if [ -z "$RELEASE" ]; then
            case "$GITHUB_REF_NAME" in v*) RELEASE="$GITHUB_REF_NAME" ;; esac
          fi
          if [ -z "$RELEASE" ] && [ -f RELEASE_VERSION ]; then
            FV="v$(tr -d ' \r\n' < RELEASE_VERSION)"
            if [ "$FV" != "v" ] && ! git ls-remote --exit-code --tags origin "refs/tags/$FV" >/dev/null 2>&1; then
              RELEASE="$FV"
            fi
          fi
          VERSION="${RELEASE:-dev-${GITHUB_SHA::7}}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "TernDays-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: terndays-apk
          path: TernDays-${{ steps.ver.outputs.version }}.apk

      - name: Repair v0.1 tag target (one-off)
        if: steps.ver.outputs.release == 'v0.1.1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v0.1 发布时 tag 被打在默认分支初始提交上，这里修正为当时构建的提交
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1" \
            -d '{"sha":"600327bfd2356f50b66308015ef9e5796356d6ca","force":true}' | head -5

      - name: Publish GitHub Release
        if: steps.ver.outputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release }}
          target_commitish: ${{ github.sha }}
          name: TernDays ${{ steps.ver.outputs.release }}
          body_path: docs/release-notes/${{ steps.ver.outputs.release }}.md
          files: TernDays-${{ steps.ver.outputs.release }}.apk
