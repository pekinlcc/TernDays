name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        working-directory: android
        run: ./gradlew --no-daemon :core:test

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="dev-${GITHUB_SHA::7}" ;; esac
          cp android/app/build/outputs/apk/release/app-release.apk "TernDays-${VERSION}.apk"
          echo "APK=TernDays-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: terndays-apk
          path: ${{ env.APK }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TernDays ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: ${{ env.APK }}
