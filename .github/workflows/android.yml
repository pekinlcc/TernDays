name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "发布版本号（如 v0.1）。填写后会在当前提交上创建该 tag 并发布 Release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        working-directory: android
        run: ./gradlew --no-daemon :core:test

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF_NAME" in
              v*) VERSION="$GITHUB_REF_NAME" ;;
              *) VERSION="dev-${GITHUB_SHA::7}" ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "TernDays-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: terndays-apk
          path: TernDays-${{ steps.ver.outputs.version }}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: TernDays ${{ steps.ver.outputs.version }}
          body_path: docs/release-notes/${{ steps.ver.outputs.version }}.md
          files: TernDays-${{ steps.ver.outputs.version }}.apk
